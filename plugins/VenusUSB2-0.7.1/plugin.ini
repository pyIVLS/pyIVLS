[plugin]
name = VenusUSB2
type = device
function = camera
class = support
load = False
version = 0.7.1

[settings]
# These are the default settings for the plugin.
exposure = -12
source = 
address = C:/Users/otsoh/Documents/pyivls/pyIVLS/plugins/VenusUSB2
filename = testData

[ai]
meta = {
  "description": "Camera device plugin for acquiring optical images of the sample. It can open and close the camera, capture a single RGB image, run live preview, keep the latest preview image in memory, and save the latest image as a JPEG file.",
  "keywords": [
    "camera",
    "image",
    "snapshot",
    "snap",
    "capture",
    "preview",
    "live preview",
    "optical",
    "sample image",
    "alignment",
    "save image"
  ],
  "capabilities": [
    "open camera connection",
    "close camera connection",
    "capture single RGB image",
    "run live preview",
    "store latest preview image",
    "save latest image as jpeg",
    "provide images for other plugins",
    "support optical inspection",
    "support alignment workflows"
  ],
  "dynamic_state_note": "Camera connection state, preview state, source, exposure, current preview thread, and latest image are dynamic and may change outside ANT. They should be refreshed through plugin functions or runtime behavior when needed.",
  "settings_note": "Main relevant settings are source, exposure, save directory, and filename. Initialization may accept arbitrary values, but functions should not work if settings are not valid.",
  "public_functions": {
    "camera_open": {
      "description": "Open the camera using current source and exposure settings.",
      "returns": "Status code and message."
    },
    "camera_close": {
      "description": "Close the camera connection.",
      "returns": "No explicit value."
    },
    "camera_capture_image": {
      "description": "Capture a single RGB image using current source and exposure settings.",
      "returns": "Status code and either an RGB image or an error object.",
      "use_for": [
        "sample inspection",
        "alignment",
        "image acquisition for other plugins"
      ]
    },
    "get_thread": {
      "description": "Return the current camera preview thread object.",
      "returns": "Camera thread object or null if preview is not running."
    },
    "setSettings": {
      "description": "Replace the internal plugin settings from a dictionary."
    },
    "set_gui_from_settings": {
      "description": "Apply the internal plugin settings to the GUI fields."
    },
    "parse_settings_widget": {
      "description": "Read current settings from the GUI and return them as a dictionary together with a status code."
    }
  },
  "internal_workflows": {
    "preview": "The plugin can start and stop live camera preview in the GUI.",
    "save_latest_image": "The plugin can validate save path and filename and save the latest available image as a JPEG file."
  }
  }