[plugin]
name = specTimeIV
type = script
function = complex
class = step
load = False
dependencies = smu,spectrometer
version = 1.0.0

[settings]
# These are the default settings for the plugin.
timestep = 1
stoptimer = True
stopafter = 0.5
address = 
filename = testData
comment = Some very long comment
samplename = test sample
autosave = False
autosaveinterval = 15
singlechannel = True
channel = not
inject = voltage
sourcesensemode = 2 wire
sourcedelaymode = auto
sourcevalue = 1
sourcelimit = 0.1
sourcenplc = 20
sourcedelay = 10
draininject = current
drainsensemode = 2 wire
draindelaymode = auto
drainvalue = 1
drainlimit = 0.1
drainnplc = 20
draindelay = 10
smu = smu_dummy
spectrometer = TLCCS
